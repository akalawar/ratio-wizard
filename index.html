<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generative Ratio Alchemist</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0c0c1e;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* Expanded Dashboard HUD Grid */
        #game-ui {
            width: 800px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(18, 18, 44, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 16px;
            box-sizing: border-box;
            border: 1px solid rgba(61, 61, 189, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        /* Individual UI Metric Cards */
        .ui-box {
            background: rgba(30, 30, 70, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            text-align: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .ui-box:hover {
            transform: translateY(-2px);
            border-color: rgba(61, 61, 189, 0.8);
            background: rgba(35, 35, 80, 0.6);
        }

        .ui-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8fa0e0;
            font-weight: 700;
        }

        .badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            min-height: 22px;
        }

        .highlight {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        canvas {
            background: linear-gradient(to bottom, #101026, #1a1a3a);
            border: 4px solid #3d3dbd;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }

        #instructions {
            margin-top: 15px;
            width: 800px;
            text-align: center;
            color: #b5e2fa;
            font-size: 14px;
            line-height: 1.6;
        }

        button {
            background: linear-gradient(135deg, #e43f5a, #ff4d6d);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 14px;
            box-shadow: 0 4px 15px rgba(228, 63, 90, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        button:hover { 
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.5);
        }

        button:active { transform: translateY(1px); }
        
        button:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="ui-box" style="box-shadow: 0 4px 10px rgba(52, 152, 219, 0.1);">
        <div class="ui-label">⏳ Session Time</div>
        <div class="badge" id="timer-badge" style="border: 1px solid rgba(52, 152, 219, 0.4); color: #3498db; font-family: monospace; font-size: 18px;">
            05:00
        </div>
    </div>

    <div class="ui-box" style="box-shadow: 0 4px 10px rgba(228, 63, 90, 0.05);">
        <div class="ui-label">🧪 Recipe Ratio</div>
        <div class="badge" id="ratio-text" style="border: 1px solid rgba(228, 63, 90, 0.3);">
            Loading...
        </div>
    </div>
    
    <div class="ui-box" style="box-shadow: 0 4px 10px rgba(241, 196, 15, 0.05);">
        <div class="ui-label">🎯 Goal Volume</div>
        <div class="badge" style="border: 1px solid rgba(241, 196, 15, 0.3); color: #f1c40f;">
            <span class="highlight" id="total-text">0</span>&nbsp;<span style="font-size: 12px; font-weight: normal; color: #aaa;">items</span>
        </div>
    </div>
    
    <div class="ui-box" style="box-shadow: 0 4px 10px rgba(46, 204, 113, 0.05);">
        <div class="ui-label">🏆 Session Record</div>
        <div class="badge" id="score-badge" style="border: 1px solid rgba(46, 204, 113, 0.4); color: #2ecc71;">
            0/0 <span style="font-size: 11px; color: #aaa; margin-left: 4px;">(0%)</span>
        </div>
    </div>
</div>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<div id="instructions">
    Use <strong>Left/Right Arrow Keys</strong> (or A/D) to move. Use <strong>Up Arrow</strong> (or W/Space) to jump.<br>
    The 5-minute challenge automatically begins moving on your very first keystroke movement!
    <br>
    <button id="reset-btn" onclick="skipPuzzle()">Skip / Reroll Recipe</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Physics Configuration
let player = { x: 50, y: 350, w: 32, h: 52, vx: 0, vy: 0, grounded: false, speed: 4.5, jumpForce: 11.5, facing: 'right' };
let cauldron = { x: 365, y: 365, w: 70, h: 55, redCount: 0, blueCount: 0 };
let items = [];
let platforms = [
    { x: 0, y: 420, w: 800, h: 30 },   
    { x: 60, y: 300, w: 180, h: 18 },  
    { x: 560, y: 300, w: 180, h: 18 }, 
    { x: 260, y: 200, w: 280, h: 18 }  
];

let keys = {};
let gameStatus = "playing"; // playing, win, fail, transitioning, session_end
let animationTimer = 0;

// Scoreboard System State Variables
let totalWins = 0;
let totalAttempts = 0;
let timerSeconds = 300; // 5 Minutes
let timerActive = false;
let sessionCountdownInterval = null;

// Math Variables
let baseRed, baseBlue, multiplier, targetTotal, requiredRed, requiredBlue;

const ratioPool = [
    { r: 1, b: 2 }, { r: 1, b: 3 }, { r: 2, b: 3 }, 
    { r: 1, b: 4 }, { r: 3, b: 2 }, { r: 3, b: 4 }  
];

function generatePuzzle() {
    let setup = ratioPool[Math.floor(Math.random() * ratioPool.length)];
    baseRed = setup.r;
    baseBlue = setup.b;
    
    multiplier = Math.floor(Math.random() * 3) + 2; 
    
    requiredRed = baseRed * multiplier;
    requiredBlue = baseBlue * multiplier;
    targetTotal = requiredRed + requiredBlue;
    
    cauldron.redCount = 0;
    cauldron.blueCount = 0;
    items = [];
    player.x = 50;
    player.y = 350;
    player.vx = 0;
    player.vy = 0;
    
    if (gameStatus !== "session_end") {
        gameStatus = "playing";
        // Resume timer execution on puzzle reset if running
        if (sessionCountdownInterval === null && timerSeconds < 300 && timerSeconds > 0) {
            startSessionTimer();
        }
    }
    
    document.getElementById('ratio-text').innerHTML = `<span style="color:#ff4d4d">${baseRed}</span><span style="font-size:12px;">🍓</span>:<span style="color:#4da6ff">${baseBlue}</span><span style="font-size:12px;">💎</span>`;
    document.getElementById('total-text').innerText = targetTotal;
    updateScoreboardUI();
}

// Fixed Balanced Spawning Algorithm Framework
function spawnItem() {
    if (items.length >= 8 || gameStatus !== "playing") return;

    let currentRedOnField = items.filter(i => i.type === "red").length;
    let currentBlueOnField = items.filter(i => i.type === "blue").length;

    let totalRedAccounted = cauldron.redCount + currentRedOnField;
    let totalBlueAccounted = cauldron.blueCount + currentBlueOnField;

    let needsRed = totalRedAccounted < requiredRed;
    let needsBlue = totalBlueAccounted < requiredBlue;

    let type = "";
    if (needsRed && needsBlue) {
        type = Math.random() > 0.5 ? "red" : "blue";
    } else if (needsRed) {
        type = "red";
    } else if (needsBlue) {
        type = "blue";
    } else {
        type = Math.random() > 0.5 ? "red" : "blue";
    }

    let plat = platforms[Math.floor(Math.random() * (platforms.length - 1)) + 1];
    let itemX = plat.x + Math.random() * (plat.w - 30) + 15;
    let itemY = plat.y - 25;
    
    if (!items.some(i => Math.abs(i.x - itemX) < 40 && Math.abs(i.y - itemY) < 40)) {
        items.push({ x: itemX, y: itemY, type: type, pulseOffset: Math.random() * Math.PI * 2 });
    }
}
setInterval(spawnItem, 800);

// Timer Management (Now features robust Pausing support)
function startSessionTimer() {
    timerActive = true;
    sessionCountdownInterval = setInterval(() => {
        timerSeconds--;
        
        let mins = Math.floor(timerSeconds / 60);
        let secs = timerSeconds % 60;
        document.getElementById('timer-badge').innerText = 
            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
        if (timerSeconds <= 0) {
            stopSessionTimer();
            gameStatus = "session_end";
            document.getElementById('reset-btn').disabled = true;
        }
    }, 1000);
}

function stopSessionTimer() {
    if (sessionCountdownInterval) {
        clearInterval(sessionCountdownInterval);
        sessionCountdownInterval = null;
    }
}

function updateScoreboardUI() {
    let winRate = totalAttempts === 0 ? 0 : Math.round((totalWins / totalAttempts) * 100);
    document.getElementById('score-badge').innerHTML = 
        `${totalWins}/${totalAttempts} <span style="font-size: 11px; color: #aaa; margin-left: 4px;">(${winRate}%)</span>`;
}

// User submission cycle transitions
function nextPuzzle(wasWon) {
    totalAttempts++;
    if (wasWon) totalWins++;
    generatePuzzle();
}

function skipPuzzle() {
    if (gameStatus !== "playing") return;
    nextPuzzle(false);
}

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    // Initial start flag capture
    if (!timerActive && timerSeconds > 0 && (keys['ArrowRight'] || keys['KeyD'] || keys['ArrowLeft'] || keys['KeyA'] || keys['Space'] || keys['ArrowUp'] || keys['KeyW'])) {
        startSessionTimer();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function update() {
    if (gameStatus !== "playing") return;

    animationTimer += 0.05;

    if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = player.speed;
        player.facing = 'right';
    } else if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -player.speed;
        player.facing = 'left';
    } else {
        player.vx = 0;
    }

    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    player.vy += 0.5;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;

    player.grounded = false;
    for (let plat of platforms) {
        if (player.x < plat.x + plat.w && player.x + player.w > plat.x &&
            player.y + player.h >= plat.y && player.y + player.h - player.vy <= plat.y + 12) {
            player.y = plat.y - player.h;
            player.vy = 0;
            player.grounded = true;
        }
    }

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        if (player.x < it.x + 15 && player.x + player.w > it.x - 15 &&
            player.y < it.y + 15 && player.y + player.h > it.y - 15) {
            
            if (it.type === "red") cauldron.redCount++;
            else cauldron.blueCount++;
            
            items.splice(i, 1);
            checkWinCondition();
        }
    }
}

function checkWinCondition() {
    let currentTotal = cauldron.redCount + cauldron.blueCount;
    if (currentTotal >= targetTotal) {
        // Halt active match timer ticks instantly
        stopSessionTimer();
        
        if (cauldron.redCount === requiredRed && cauldron.blueCount === requiredBlue) {
            gameStatus = "win";
            setTimeout(() => { 
                if (gameStatus !== "session_end") nextPuzzle(true); 
            }, 5000); // 5 Second Display Duration
        } else {
            gameStatus = "fail";
            setTimeout(() => { 
                if (gameStatus !== "session_end") nextPuzzle(false); 
            }, 5000); // 5 Second Display Duration
        }
    }
}

// Custom Procedural Render System Core 
function drawWizard(x, y, facing) {
    ctx.save();
    ctx.translate(x + 16, y + 26);
    let bounce = Math.sin(animationTimer * 2) * 1.5;
    ctx.translate(0, bounce);

    ctx.fillStyle = "#5c3ca6";
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(-16, 26);
    ctx.lineTo(16, 26);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#432b80";
    ctx.fillRect(-4, 4, 8, 22);

    ctx.fillStyle = "#ffd4a1";
    ctx.beginPath();
    ctx.arc(0, -12, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#f1c40f";
    let eyeOffset = facing === 'right' ? 3 : -3;
    ctx.beginPath();
    ctx.arc(eyeOffset - 2, -14, 2, 0, Math.PI * 2);
    ctx.arc(eyeOffset + 3, -14, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#e6e6fa";
    ctx.beginPath();
    ctx.moveTo(-7, -10);
    ctx.lineTo(0, 10);
    ctx.lineTo(7, -10);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#432b80";
    ctx.fillRect(-15, -22, 30, 4);
    ctx.fillStyle = "#5c3ca6";
    ctx.beginPath();
    ctx.moveTo(-10, -22);
    ctx.lineTo(facing === 'right' ? 8 : -8, -46);
    ctx.lineTo(10, -22);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#f1c40f";
    ctx.fillRect(-10, -22, 20, 3);
    ctx.restore();
}

function drawBerry(x, y, pulse) {
    ctx.save();
    ctx.translate(x, y + Math.sin(pulse) * 2);
    ctx.fillStyle = "#e43f5a";
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.bezierCurveTo(12, -10, 14, 6, 0, 14);
    ctx.bezierCurveTo(-14, 6, -12, -10, 0, -10);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#f1c40f";
    ctx.fillRect(-4, -2, 1.5, 2);
    ctx.fillRect(4, -2, 1.5, 2);
    ctx.fillRect(0, 4, 1.5, 2);

    ctx.fillStyle = "#2ecc71";
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(-6, -14);
    ctx.lineTo(0, -12);
    ctx.lineTo(6, -14);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawCrystal(x, y, pulse) {
    ctx.save();
    ctx.translate(x, y + Math.cos(pulse) * 2);
    let gradient = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
    gradient.addColorStop(0, 'rgba(77, 166, 255, 0.6)');
    gradient.addColorStop(1, 'rgba(77, 166, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#00bcd4";
    ctx.beginPath();
    ctx.moveTo(0, -12);  
    ctx.lineTo(10, -2);  
    ctx.lineTo(0, 12);   
    ctx.lineTo(-10, -2); 
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#e0f7fa";
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(10, -2);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#4da6ff";
    ctx.beginPath();
    ctx.moveTo(-10, -2);
    ctx.lineTo(0, 12);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Stars / Background Dust
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    for(let i=1; i<6; i++) {
        let starX = (i * 135) % canvas.width;
        let starY = (i * 75) % (canvas.height - 100);
        ctx.fillRect(starX, starY, 3, 3);
    }

    for (let plat of platforms) {
        ctx.fillStyle = "#222244";
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.fillStyle = "#3d3dbd";
        ctx.fillRect(plat.x, plat.y, plat.w, 4);
    }

    // Cauldron Drawing
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(cauldron.x + 35, cauldron.y + 50, 30, 6, 0, 0, 2 * Math.PI);
    ctx.fill();

    ctx.fillStyle = "#2c3e50";
    ctx.fillRect(cauldron.x, cauldron.y + 10, cauldron.w, cauldron.h - 10);
    ctx.beginPath();
    ctx.arc(cauldron.x + 35, cauldron.y + 30, 35, 0, Math.PI, false);
    ctx.fill();

    ctx.fillStyle = "#34495e";
    ctx.fillRect(cauldron.x - 4, cauldron.y + 6, cauldron.w + 8, 8);

    let brewColor = (gameStatus === "fail") ? "#e74c3c" : "#2ecc71";
    ctx.fillStyle = brewColor;
    ctx.beginPath();
    ctx.ellipse(cauldron.x + 35, cauldron.y + 7, 31, 6, 0, 0, 2 * Math.PI);
    ctx.fill();

    ctx.fillStyle = brewColor;
    let bubble1Y = cauldron.y - 2 - (Math.abs(Math.sin(animationTimer)) * 12);
    let bubble2Y = cauldron.y - 6 - (Math.abs(Math.cos(animationTimer * 1.5)) * 15);
    ctx.beginPath();
    ctx.arc(cauldron.x + 20, bubble1Y, 3, 0, Math.PI * 2);
    ctx.arc(cauldron.x + 48, bubble2Y, 4, 0, Math.PI * 2);
    ctx.fill();

    // Draw Live Active Items
    for (let it of items) {
        if (it.type === "red") {
            drawBerry(it.x, it.y, animationTimer + it.pulseOffset);
        } else {
            drawCrystal(it.x, it.y, animationTimer + it.pulseOffset);
        }
    }

    // Draw Wizard character 
    drawWizard(player.x, player.y, player.facing);

    // Live Sub-HUD text indicators painted inside canvas
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "bold 13px Segoe UI";
    ctx.textAlign = "left";
    ctx.fillText(`Cauldron Mix: ${cauldron.redCount} 🍓 / ${cauldron.blueCount} 💎`, 20, 35);

    // Context Overlays
    if (gameStatus === "win") {
        ctx.fillStyle = "rgba(10, 10, 25, 0.92)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#2ecc71";
        ctx.font = "bold 34px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("✨ Alchemy Success! ✨", canvas.width/2, 170);
        ctx.fillStyle = "#fff";
        ctx.font = "18px Segoe UI";
        ctx.fillText(`Perfect balance! ${cauldron.redCount} Berries and ${cauldron.blueCount} Crystals matched ${baseRed}:${baseBlue}.`, canvas.width/2, 230);
        
        ctx.fillStyle = "#f1c40f";
        ctx.font = "bold 15px Segoe UI";
        ctx.fillText("Time is Paused! Next recipe loading in 5 seconds...", canvas.width/2, 310);

    } else if (gameStatus === "fail") {
        ctx.fillStyle = "rgba(15, 10, 10, 0.94)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#e74c3c";
        ctx.font = "bold 34px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("💥 Volatile Mixture! Potion Exploded! 💥", canvas.width/2, 140);
        ctx.fillStyle = "#fff";
        ctx.font = "18px Segoe UI";
        ctx.fillText(`You mixed ${cauldron.redCount} 🍓 and ${cauldron.blueCount} 💎 (Target Total was ${targetTotal}).`, canvas.width/2, 200);
        ctx.fillStyle = "#f1c40f";
        ctx.fillText(`To clear ${baseRed}:${baseBlue}, you needed exactly ${requiredRed} 🍓 and ${requiredBlue} 💎.`, canvas.width/2, 245);
        
        ctx.fillStyle = "#3498db";
        ctx.font = "bold 15px Segoe UI";
        ctx.fillText("Time is Paused! Next formula loading in 5 seconds...", canvas.width/2, 320);

    } else if (gameStatus === "session_end") {
        ctx.fillStyle = "rgba(8, 8, 20, 0.96)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = "#3d3dbd";
        ctx.lineWidth = 4;
        ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

        ctx.fillStyle = "#f1c40f";
        ctx.font = "bold 38px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("🧙‍♂️ SESSION COMPLETED 🧙‍♂️", canvas.width / 2, 110);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px Segoe UI";
        ctx.fillText("Your absolute grand alchemist trial efficiency results:", canvas.width / 2, 165);

        ctx.fillStyle = "#b5e2fa";
        ctx.font = "22px Segoe UI";
        ctx.fillText(`Total Formulas Solved: ${totalWins}`, canvas.width / 2, 220);
        ctx.fillStyle = "#e43f5a";
        ctx.fillText(`Total Attempts Made: ${totalAttempts}`, canvas.width / 2, 255);

        let finalRate = totalAttempts === 0 ? 0 : Math.round((totalWins / totalAttempts) * 100);
        
        ctx.fillStyle = "#2ecc71";
        ctx.font = "bold 32px Segoe UI";
        ctx.fillText(`Final Mastery Accuracy: ${finalRate}%`, canvas.width / 2, 320);

        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.font = "14px Segoe UI";
        ctx.fillText("Refresh the webpage instance to attempt a new speedrun trial score!", canvas.width / 2, 385);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Kickstart system
generatePuzzle();
gameLoop();
</script>

</body>
</html>
