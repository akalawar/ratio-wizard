<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generative Ratio Alchemist</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0c0c1e;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* Expanded Dashboard HUD Grid */
        #game-ui {
            width: 800px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(18, 18, 44, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 16px;
            box-sizing: border-box;
            border: 1px solid rgba(61, 61, 189, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .ui-box {
            background: rgba(30, 30, 70, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            text-align: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .ui-box:hover {
            transform: translateY(-2px);
            border-color: rgba(61, 61, 189, 0.8);
            background: rgba(35, 35, 80, 0.6);
        }

        .ui-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8fa0e0;
            font-weight: 700;
        }

        .badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            min-height: 22px;
        }

        .highlight {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .goal-alert-badge {
            background: rgba(241, 196, 15, 0.15);
            border: 1px solid rgba(241, 196, 15, 0.6) !important;
            color: #f1c40f !important;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            margin-left: 6px;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.2);
        }

        canvas {
            background: linear-gradient(to bottom, #090918, #131326);
            border: 4px solid #3d3dbd;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }

        #instructions {
            margin-top: 15px;
            width: 800px;
            text-align: center;
            color: #b5e2fa;
            font-size: 14px;
            line-height: 1.6;
        }

        button {
            background: linear-gradient(135deg, #e43f5a, #ff4d6d);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 14px;
            box-shadow: 0 4px 15px rgba(228, 63, 90, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        button:hover { 
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.5);
        }

        button:active { transform: translateY(1px); }
        
        button:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="ui-box" style="box-shadow: 0 4px 10px rgba(52, 152, 219, 0.1);">
        <div class="ui-label">⏳ Session Time</div>
        <div class="badge" id="timer-badge" style="border: 1px solid rgba(52, 152, 219, 0.4); color: #3498db; font-family: monospace; font-size: 18px;">
            05:00
        </div>
    </div>

    <div class="ui-box" style="box-template-columns: span 1; box-shadow: 0 4px 12px rgba(241, 196, 15, 0.15); border-color: rgba(241, 196, 15, 0.25);">
        <div class="ui-label" style="color: #f1c40f;">🧪 Target Recipe</div>
        <div class="badge" id="ratio-text" style="border: 1px solid rgba(228, 63, 90, 0.35); padding-right: 4px;">
            Loading...
        </div>
    </div>
    
    <div class="ui-box" style="box-shadow: 0 4px 10px rgba(168, 85, 247, 0.05);">
        <div class="ui-label">🔮 Cauldron Mix</div>
        <div class="badge" id="loadout-badge" style="border: 1px solid rgba(168, 85, 247, 0.4); color: #e9d5ff;">
            <span style="color:#ff4d4d" id="loadout-red">0</span>🍓 / <span style="color:#4da6ff" id="loadout-blue">0</span>💎
        </div>
    </div>
    
    <div class="ui-box" style="box-shadow: 0 4px 10px rgba(46, 204, 113, 0.05);">
        <div class="ui-label">🏆 Session Record</div>
        <div class="badge" id="score-badge" style="border: 1px solid rgba(46, 204, 113, 0.4); color: #2ecc71;">
            0/0 <span style="font-size: 11px; color: #aaa; margin-left: 4px;">(0%)</span>
        </div>
    </div>
</div>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<div id="instructions">
    Use <strong>Left/Right Arrow Keys</strong> (or A/D) to move. Use <strong>Up Arrow</strong> (or W/Space) to jump.<br>
    The 5-minute challenge automatically begins moving on your very first keystroke movement!
    <br>
    <button id="reset-btn" onclick="skipPuzzle()">Skip / Reroll Recipe</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Physics Configuration
let player = { x: 50, y: 340, w: 42, h: 62, vx: 0, vy: 0, grounded: false, speed: 4.8, jumpForce: 12.0, facing: 'right' };
let cauldron = { x: 355, y: 350, w: 90, h: 70, redCount: 0, blueCount: 0 };
let items = [];
let platforms = [
    { x: 0, y: 420, w: 800, h: 30 },   
    { x: 60, y: 300, w: 180, h: 18 },  
    { x: 560, y: 300, w: 180, h: 18 }, 
    { x: 260, y: 200, w: 280, h: 18 }  
];

let keys = {};
let gameStatus = "playing"; 
let animationTimer = 0;

// Scoreboard System State Variables
let totalWins = 0;
let totalAttempts = 0;
let timerSeconds = 300; 
let timerActive = false;
let sessionCountdownInterval = null;

// Math Variables
let baseRed, baseBlue, multiplier, targetTotal, requiredRed, requiredBlue;

const ratioPool = [
    { r: 1, b: 2 }, { r: 1, b: 3 }, { r: 2, b: 3 }, 
    { r: 1, b: 4 }, { r: 3, b: 2 }, { r: 3, b: 4 }  
];

function generatePuzzle() {
    let setup = ratioPool[Math.floor(Math.random() * ratioPool.length)];
    baseRed = setup.r;
    baseBlue = setup.b;
    
    multiplier = Math.floor(Math.random() * 3) + 2; 
    
    requiredRed = baseRed * multiplier;
    requiredBlue = baseBlue * multiplier;
    targetTotal = requiredRed + requiredBlue;
    
    cauldron.redCount = 0;
    cauldron.blueCount = 0;
    items = [];
    player.x = 50;
    player.y = 340;
    player.vx = 0;
    player.vy = 0;
    
    if (gameStatus !== "session_end") {
        gameStatus = "playing";
        if (sessionCountdownInterval === null && timerSeconds < 300 && timerSeconds > 0) {
            startSessionTimer();
        }
    }
    
    // Injected Prominent Goal Visualizer Box
    document.getElementById('ratio-text').innerHTML = `
        <span style="color:#ff4d4d">${baseRed}</span><span style="font-size:12px;">🍓</span>:<span style="color:#4da6ff">${baseBlue}</span><span style="font-size:12px;">💎</span> 
        <span class="goal-alert-badge">GOAL: ${targetTotal}</span>
    `;
    updateLoadoutUI();
    updateScoreboardUI();
}

function spawnItem() {
    if (items.length >= 8 || gameStatus !== "playing") return;

    let currentRedOnField = items.filter(i => i.type === "red").length;
    let currentBlueOnField = items.filter(i => i.type === "blue").length;

    let totalRedAccounted = cauldron.redCount + currentRedOnField;
    let totalBlueAccounted = cauldron.blueCount + currentBlueOnField;

    let needsRed = totalRedAccounted < requiredRed;
    let needsBlue = totalBlueAccounted < requiredBlue;

    let type = "";
    if (needsRed && needsBlue) {
        type = Math.random() > 0.5 ? "red" : "blue";
    } else if (needsRed) {
        type = "red";
    } else if (needsBlue) {
        type = "blue";
    } else {
        type = Math.random() > 0.5 ? "red" : "blue";
    }

    let plat = platforms[Math.floor(Math.random() * (platforms.length - 1)) + 1];
    let itemX = plat.x + Math.random() * (plat.w - 40) + 20;
    let itemY = plat.y - 25;
    
    if (!items.some(i => Math.abs(i.x - itemX) < 45 && Math.abs(i.y - itemY) < 45)) {
        items.push({ x: itemX, y: itemY, type: type, pulseOffset: Math.random() * Math.PI * 2 });
    }
}
setInterval(spawnItem, 800);

function startSessionTimer() {
    timerActive = true;
    sessionCountdownInterval = setInterval(() => {
        timerSeconds--;
        
        let mins = Math.floor(timerSeconds / 60);
        let secs = timerSeconds % 60;
        document.getElementById('timer-badge').innerText = 
            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
        if (timerSeconds <= 0) {
            stopSessionTimer();
            gameStatus = "session_end";
            document.getElementById('reset-btn').disabled = true;
        }
    }, 1000);
}

function stopSessionTimer() {
    if (sessionCountdownInterval) {
        clearInterval(sessionCountdownInterval);
        sessionCountdownInterval = null;
    }
}

function updateLoadoutUI() {
    document.getElementById('loadout-red').innerText = cauldron.redCount;
    document.getElementById('loadout-blue').innerText = cauldron.blueCount;
}

function updateScoreboardUI() {
    let winRate = totalAttempts === 0 ? 0 : Math.round((totalWins / totalAttempts) * 100);
    document.getElementById('score-badge').innerHTML = 
        `${totalWins}/${totalAttempts} <span style="font-size: 11px; color: #aaa; margin-left: 4px;">(${winRate}%)</span>`;
}

function nextPuzzle(wasWon) {
    totalAttempts++;
    if (wasWon) totalWins++;
    generatePuzzle();
}

function skipPuzzle() {
    if (gameStatus !== "playing") return;
    nextPuzzle(false);
}

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (!timerActive && timerSeconds > 0 && (keys['ArrowRight'] || keys['KeyD'] || keys['ArrowLeft'] || keys['KeyA'] || keys['Space'] || keys['ArrowUp'] || keys['KeyW'])) {
        startSessionTimer();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function update() {
    if (gameStatus !== "playing") return;

    animationTimer += 0.05;

    if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = player.speed;
        player.facing = 'right';
    } else if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -player.speed;
        player.facing = 'left';
    } else {
        player.vx = 0;
    }

    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    player.vy += 0.5;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;

    player.grounded = false;
    for (let plat of platforms) {
        if (player.x < plat.x + plat.w && player.x + player.w > plat.x &&
            player.y + player.h >= plat.y && player.y + player.h - player.vy <= plat.y + 12) {
            player.y = plat.y - player.h;
            player.vy = 0;
            player.grounded = true;
        }
    }

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        if (player.x < it.x + 20 && player.x + player.w > it.x - 20 &&
            player.y < it.y + 20 && player.y + player.h > it.y - 20) {
            
            if (it.type === "red") cauldron.redCount++;
            else cauldron.blueCount++;
            
            updateLoadoutUI();
            items.splice(i, 1);
            checkWinCondition();
        }
    }
}

function checkWinCondition() {
    let currentTotal = cauldron.redCount + cauldron.blueCount;
    if (currentTotal >= targetTotal) {
        stopSessionTimer();
        
        if (cauldron.redCount === requiredRed && cauldron.blueCount === requiredBlue) {
            gameStatus = "win";
            setTimeout(() => { if (gameStatus !== "session_end") nextPuzzle(true); }, 5000);
        } else {
            gameStatus = "fail";
            setTimeout(() => { if (gameStatus !== "session_end") nextPuzzle(false); }, 5000);
        }
    }
}

/* ========================================================================
   HIGH ACCURACY PROCEDURAL ART RENDER ENGINE
   ======================================================================== */

function drawWizard(x, y, facing) {
    ctx.save();
    ctx.translate(x + player.w / 2, y + player.h / 2 + 5);
    
    let isMoving = Math.abs(player.vx) > 0.1;
    let walkCycle = isMoving ? Math.sin(animationTimer * 2.5) : 0;
    let idleBounce = Math.sin(animationTimer * 1.5) * 1.5;
    
    ctx.translate(0, idleBounce);
    ctx.rotate(walkCycle * 0.06);

    let flip = facing === 'right' ? 1 : -1;
    ctx.scale(flip, 1);

    // 1. Wizard Robe
    let bodyGrad = ctx.createRadialGradient(-3, 10, 2, 0, 15, 25);
    bodyGrad.addColorStop(0, '#7852e6');
    bodyGrad.addColorStop(0.7, '#5033aa');
    bodyGrad.addColorStop(1, '#341f71');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-18, 26);
    ctx.bezierCurveTo(-16, 0, -12, -8, 0, -8);
    ctx.bezierCurveTo(12, -8, 16, 0, 18, 26);
    ctx.closePath();
    ctx.fill();

    // 2. Big Cartoon Fluffy Beard
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(-10, -10);
    ctx.bezierCurveTo(-16, 5, -12, 20, 0, 24); 
    ctx.bezierCurveTo(12, 20, 16, 5, 10, -10);
    ctx.bezierCurveTo(5, -4, -5, -4, -10, -10);
    ctx.closePath();
    ctx.fill();
    
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 3. Cartoon Face
    ctx.fillStyle = "#ffc09f"; 
    ctx.beginPath();
    ctx.arc(3, -12, 7, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = "#ff9e79";
    ctx.beginPath();
    ctx.arc(7, -11, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(3, -15, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#222"; 
    ctx.beginPath();
    ctx.arc(4, -15, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // 4. Over-sized Drooping Wizard Hat
    let hatGrad = ctx.createLinearGradient(-15, -40, 15, -15);
    hatGrad.addColorStop(0, '#5c3ca6');
    hatGrad.addColorStop(1, '#3a2170');
    
    ctx.fillStyle = "#4a2f8a";
    ctx.beginPath();
    ctx.ellipse(0, -18, 22, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#25144b";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = hatGrad;
    ctx.beginPath();
    ctx.moveTo(-14, -19);
    ctx.bezierCurveTo(-10, -38, 5, -42, 12, -40); 
    ctx.bezierCurveTo(16, -45, 20, -42, 22, -38); 
    ctx.bezierCurveTo(14, -30, 8, -24, 13, -19);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#f1c40f";
    ctx.fillRect(5, -23, 6, 6);
    ctx.fillStyle = "#e67e22";
    ctx.fillRect(7, -21, 2, 2);

    ctx.restore();
}

function drawBerry(x, y, pulse) {
    ctx.save();
    let animScale = 1 + Math.sin(pulse * 2) * 0.05;
    ctx.translate(x, y);
    ctx.scale(animScale, animScale);

    let berryGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 14);
    berryGrad.addColorStop(0, '#ff5e7e');
    berryGrad.addColorStop(0.6, '#e43f5a');
    berryGrad.addColorStop(1, '#9a1f35');
    
    ctx.fillStyle = berryGrad;
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.bezierCurveTo(14, -12, 16, 6, 0, 15);  
    ctx.bezierCurveTo(-16, 6, -14, -12, 0, -12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
    ctx.beginPath();
    ctx.ellipse(-5, -5, 4, 2, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#f1c40f";
    let seeds = [[-5, 2], [5, 2], [0, 7], [-4, -4], [4, -4]];
    seeds.forEach(s => {
        ctx.beginPath();
        ctx.arc(s[0], s[1], 1.2, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = "#2ecc71";
    ctx.beginPath(); 
    ctx.ellipse(-4, -13, 5, 2.5, -Math.PI/6, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath(); 
    ctx.ellipse(4, -13, 5, 2.5, Math.PI/6, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = "#27ae60"; 
    ctx.fillRect(-1.5, -14, 3, 3);

    ctx.restore();
}

function drawCrystal(x, y, pulse) {
    ctx.save();
    ctx.translate(x, y);

    let glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
    glow.addColorStop(0, 'rgba(0, 242, 254, 0.45)');
    glow.addColorStop(0.5, 'rgba(77, 166, 255, 0.15)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(0, Math.cos(pulse) * 2.5);

    let gradA = ctx.createLinearGradient(0,-16, -12, -2);
    gradA.addColorStop(0, '#e0f7fa'); gradA.addColorStop(1, '#00b4d8');
    ctx.fillStyle = gradA;
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(-12, -2); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();

    let gradB = ctx.createLinearGradient(0,-16, 12, -2);
    gradB.addColorStop(0, '#ffffff'); gradB.addColorStop(1, '#90e0ef');
    ctx.fillStyle = gradB;
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(12, -2); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();

    let gradC = ctx.createLinearGradient(-12,-2, 0, 16);
    gradC.addColorStop(0, '#0077b6'); gradC.addColorStop(1, '#03045e');
    ctx.fillStyle = gradC;
    ctx.beginPath(); ctx.moveTo(-12, -2); ctx.lineTo(0, 16); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();

    let gradD = ctx.createLinearGradient(12,-2, 0, 16);
    gradD.addColorStop(0, '#0096c7'); gradD.addColorStop(1, '#023e8a');
    ctx.fillStyle = gradD;
    ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(0, 16); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(0, 16);
    ctx.moveTo(-12, -2);
    ctx.lineTo(12, -2);
    ctx.stroke();

    ctx.restore();
}

function drawCauldron() {
    ctx.save();
    ctx.translate(cauldron.x, cauldron.y);

    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.beginPath();
    ctx.ellipse(cauldron.w / 2, cauldron.h - 5, 42, 8, 0, 0, 2 * Math.PI);
    ctx.fill();

    let ironGrad = ctx.createRadialGradient(cauldron.w / 3, cauldron.h / 2, 5, cauldron.w / 2, cauldron.h / 2, cauldron.w / 2);
    ironGrad.addColorStop(0, '#3a4f66'); 
    ironGrad.addColorStop(0.5, '#2c3e50');
    ironGrad.addColorStop(0.9, '#1a252f');
    ironGrad.addColorStop(1, '#0f171e'); 
    
    ctx.fillStyle = ironGrad;
    ctx.beginPath();
    ctx.moveTo(8, 18);
    ctx.bezierCurveTo(-12, cauldron.h - 10, cauldron.w + 12, cauldron.h - 10, cauldron.w - 8, 18);
    ctx.lineTo(cauldron.w, 18);
    ctx.closePath();
    ctx.fill();

    let rimGrad = ctx.createLinearGradient(0, 10, cauldron.w, 18);
    rimGrad.addColorStop(0, '#4f6984');
    rimGrad.addColorStop(0.5, '#2c3e50');
    rimGrad.addColorStop(1, '#111b24');
    ctx.fillStyle = rimGrad;
    ctx.fillRect(-4, 10, cauldron.w + 8, 9);
    
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-4, 11); ctx.lineTo(cauldron.w + 4, 11); ctx.stroke();

    let brewColor = (gameStatus === "fail") ? "#e74c3c" : "#2ecc71";
    let brewGlow = (gameStatus === "fail") ? "#ff7675" : "#55efc4";
    
    let liquidGrad = ctx.createRadialGradient(cauldron.w/2, 11, 2, cauldron.w/2, 11, cauldron.w/2 - 5);
    liquidGrad.addColorStop(0, brewGlow);
    liquidGrad.addColorStop(0.8, brewColor);
    liquidGrad.addColorStop(1, '#1b6336');

    ctx.fillStyle = liquidGrad;
    ctx.beginPath();
    ctx.ellipse(cauldron.w / 2, 11, cauldron.w / 2 + 1, 5, 0, 0, 2 * Math.PI);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath();
    ctx.ellipse(cauldron.w / 2 + Math.sin(animationTimer)*3, 11, cauldron.w / 3, 2, 0, 0, 2 * Math.PI);
    ctx.fill();

    ctx.fillStyle = brewGlow;
    let b1X = cauldron.w * 0.3 + (Math.sin(animationTimer * 1.2) * 6);
    let b1Y = 6 - (Math.abs(Math.sin(animationTimer * 1.5)) * 22);
    let b2X = cauldron.w * 0.7 + (Math.cos(animationTimer * 0.9) * 8);
    let b2Y = 4 - (Math.abs(Math.cos(animationTimer * 1.1)) * 26);

    if(b1Y < 12 && gameStatus === "playing") {
        ctx.beginPath(); ctx.arc(b1X, b1Y + 10, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b1X - 1, b1Y + 9, 1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = brewGlow;
    if(b2Y < 12 && gameStatus === "playing") {
        ctx.beginPath(); ctx.arc(b2X, b2Y + 10, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b2X - 1, b2Y + 9, 1.2, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    for(let i=1; i<8; i++) {
        let starX = (i * 113) % canvas.width;
        let starY = (i * 63) % (canvas.height - 100);
        let size = (i % 2 === 0) ? 2 : 3;
        ctx.fillRect(starX, starY, size, size);
    }

    for (let plat of platforms) {
        let platGrad = ctx.createLinearGradient(plat.x, plat.y, plat.x, plat.y + plat.h);
        platGrad.addColorStop(0, '#2a2a54');
        platGrad.addColorStop(1, '#161633');
        ctx.fillStyle = platGrad;
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        
        ctx.fillStyle = '#4d4dff';
        ctx.fillRect(plat.x, plat.y, plat.w, 4);
    }

    drawCauldron();

    for (let it of items) {
        if (it.type === "red") {
            drawBerry(it.x, it.y, animationTimer + it.pulseOffset);
        } else {
            drawCrystal(it.x, it.y, animationTimer + it.pulseOffset);
        }
    }

    drawWizard(player.x, player.y, player.facing);

    if (gameStatus === "win") {
        ctx.fillStyle = "rgba(7, 7, 18, 0.93)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#2ecc71";
        ctx.font = "bold 34px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("✨ Alchemy Success! ✨", canvas.width/2, 170);
        ctx.fillStyle = "#fff";
        ctx.font = "18px Segoe UI";
        ctx.fillText(`Perfect balance! ${cauldron.redCount} Berries and ${cauldron.blueCount} Crystals matched ${baseRed}:${baseBlue}.`, canvas.width/2, 230);
        
        ctx.fillStyle = "#f1c40f";
        ctx.font = "bold 15px Segoe UI";
        ctx.fillText("Time is Paused! Next recipe loading in 5 seconds...", canvas.width/2, 310);

    } else if (gameStatus === "fail") {
        ctx.fillStyle = "rgba(12, 6, 6, 0.95)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#e74c3c";
        ctx.font = "bold 34px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("💥 Volatile Mixture! Potion Exploded! 💥", canvas.width/2, 140);
        ctx.fillStyle = "#fff";
        ctx.font = "18px Segoe UI";
        ctx.fillText(`You mixed ${cauldron.redCount} 🍓 and ${cauldron.blueCount} 💎 (Target Total was ${targetTotal}).`, canvas.width/2, 200);
        ctx.fillStyle = "#f1c40f";
        ctx.fillText(`To clear ${baseRed}:${baseBlue}, you needed exactly ${requiredRed} 🍓 and ${requiredBlue} 💎.`, canvas.width/2, 245);
        
        ctx.fillStyle = "#3498db";
        ctx.font = "bold 15px Segoe UI";
        ctx.fillText("Time is Paused! Next formula loading in 5 seconds...", canvas.width/2, 320);

    } else if (gameStatus === "session_end") {
        ctx.fillStyle = "rgba(5, 5, 12, 0.97)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = "#3d3dbd";
        ctx.lineWidth = 4;
        ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

        ctx.fillStyle = "#f1c40f";
        ctx.font = "bold 38px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("🧙‍♂️ SESSION COMPLETED 🧙‍♂️", canvas.width / 2, 110);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px Segoe UI";
        ctx.fillText("Your absolute grand alchemist trial efficiency results:", canvas.width / 2, 165);

        ctx.fillStyle = "#b5e2fa";
        ctx.font = "22px Segoe UI";
        ctx.fillText(`Total Formulas Solved: ${totalWins}`, canvas.width / 2, 220);
        ctx.fillStyle = "#e43f5a";
        ctx.fillText(`Total Attempts Made: ${totalAttempts}`, canvas.width / 2, 255);

        let finalRate = totalAttempts === 0 ? 0 : Math.round((totalWins / totalAttempts) * 100);
        
        ctx.fillStyle = "#2ecc71";
        ctx.font = "bold 32px Segoe UI";
        ctx.fillText(`Final Mastery Accuracy: ${finalRate}%`, canvas.width / 2, 320);

        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.font = "14px Segoe UI";
        ctx.fillText("Refresh the webpage instance to attempt a new speedrun trial score!", canvas.width / 2, 385);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Initial System Execution Call
generatePuzzle();
gameLoop();
</script>
