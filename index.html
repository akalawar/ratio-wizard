<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ratio Alchemist: Fully Animated Wizard</title>
    <style>
        /* Existing Styles, optimized for canvas performance */
        body { margin: 0; padding: 20px; background-color: #1a1a2e; font-family: 'Segoe UI', sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; }
        #game-ui { width: 800px; display: flex; justify-content: space-between; margin-bottom: 10px; background: #162447; padding: 15px; border-radius: 8px; box-sizing: border-box; border: 2px solid #0f4c81; }
        .ui-box { font-size: 16px; }
        .highlight { font-weight: bold; font-size: 18px; }
        canvas { background: #1f4068; border: 4px solid #162447; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        #instructions { margin-top: 15px; width: 800px; text-align: center; color: #b5e2fa; font-size: 14px; }
        button { background: #e43f5a; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        button:hover { background: #ff4d6d; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 24px; font-weight: bold; z-index: 999; }
    </style>
</head>
<body>

<div id="loading-overlay">🌟 Loading Magical Assets...</div>

<div id="game-ui">
    <div class="ui-box">🧪 **Target Ratio:** <span class="highlight" id="ratio-text" style="color: #ff4d4d;">Loading...</span></div>
    <div class="ui-box">🎯 **Required Total Items:** <span class="highlight" id="total-text" style="color: #f1c40f;">0</span></div>
    <div class="ui-box">🧺 **Cauldron:** <span style="color: #ff4d4d;" id="ui-red">0</span> | <span style="color: #4da6ff;" id="ui-blue">0</span></div>
</div>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<div id="instructions">
    Use <strong>Left/Right Arrow Keys</strong> (or A/D) to move. Use <strong>Up Arrow</strong> (or W/Space) to jump.<br>
    Calculate your targets, collect the correct amounts, and hit the total!
    <br>
    <button id="reset-btn" onclick="generatePuzzle()">Reroll New Math Puzzle</button>
</div>
